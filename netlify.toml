[build]
command = "pnpm build"
# publish dir is auto-detected by Netlify's Nuxt framework integration
# (Nuxt generate writes to .output/public locally; the integration handles deploy)

# Hashed Nuxt assets: cache forever at the edge AND in the browser.
# Netlify-CDN-Cache-Control controls Netlify's edge cache; without it, edge
# evicts aggressively and every cold request goes to origin.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/noise.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gruper.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Netlify-CDN-Cache-Control = "public, max-age=86400"
